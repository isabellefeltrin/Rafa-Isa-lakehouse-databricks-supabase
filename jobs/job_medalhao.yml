resources:
  jobs:
    pipeline_medalhao_seguradora:
      name: pipeline_medalhao_seguradora
      description: >-
        Lakehouse da seguradora na arquitetura medalhão:
        Supabase (PostgreSQL) -> LANDING (CSV) -> BRONZE -> SILVER (Data Quality) -> GOLD (Kimball).
      max_concurrent_runs: 1
      parameters:
        - name: catalogo
          default: workspace
        - name: modo_extracao
          default: supabase
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: /Workspace/Users/isalufeltrin@gmail.com/Rafa-Isa-lakehouse-databricks-supabase/notebooks/00_setup
            source: WORKSPACE

        - task_key: extracao_landing
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: /Workspace/Users/isalufeltrin@gmail.com/Rafa-Isa-lakehouse-databricks-supabase/notebooks/01_extracao_landing
            source: WORKSPACE

        - task_key: bronze
          depends_on:
            - task_key: extracao_landing
          notebook_task:
            notebook_path: /Workspace/Users/isalufeltrin@gmail.com/Rafa-Isa-lakehouse-databricks-supabase/notebooks/02_bronze
            source: WORKSPACE

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/isalufeltrin@gmail.com/Rafa-Isa-lakehouse-databricks-supabase/notebooks/03_silver
            source: WORKSPACE

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/isalufeltrin@gmail.com/Rafa-Isa-lakehouse-databricks-supabase/notebooks/04_gold
            source: WORKSPACE

      queue:
        enabled: true
